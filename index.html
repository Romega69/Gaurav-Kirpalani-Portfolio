<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaurav Kirpalani — Creative Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@200..900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff5a1f;--bg:#07040a;--text:#f5f2f4;--muted:#b9aab4;--line:rgba(255,255,255,.14);--site-gutter:clamp(20px,3.2vw,56px);--content-width:1600px;--font:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
#bg{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0;pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 5vw 18px;transition:opacity .3s,background .3s;opacity:0;pointer-events:none}
nav.s{background:rgba(7,4,10,.6);backdrop-filter:blur(14px)}
nav.s{opacity:1;pointer-events:auto}
.logo{font-weight:700;font-size:22px;letter-spacing:-.03em;color:var(--text);text-decoration:none}.logo i{color:var(--accent);font-style:normal}
.links{display:flex;gap:36px}.links a{color:var(--text);text-decoration:none;font-size:14px;opacity:.8;transition:.2s}.links a:hover{opacity:1;color:var(--accent)}
.cta{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#0b0b0d;text-decoration:none;font-size:13px;font-weight:600;padding:6px 6px 6px 20px;border-radius:99px}
.cta b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:400}
section{position:relative;padding:120px 5vw;max-width:1400px;margin:auto}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:34px 5vw 58px;max-width:1600px;isolation:isolate}
.hero-top{display:flex;justify-content:space-between;gap:24px;font-size:12px;line-height:1.45;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.78)}
.hero-top p{margin:0}
.availability{white-space:nowrap}.availability i{color:var(--accent);font-style:normal}
.hero-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,28%);align-items:end;gap:6vw}
.hero-copy{max-width:950px}
.hero-greeting{font-size:clamp(24px,3vw,40px);font-weight:300;font-style:italic;color:rgba(255,255,255,.8);margin-bottom:4px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
h1{display:flex;align-items:baseline;gap:.18em;flex-wrap:wrap;font-size:clamp(48px,6vw,96px);line-height:.9;letter-spacing:-.065em;font-weight:300}
h1 span{display:inline-block}h1 span:nth-child(even){font-weight:300;font-style:normal;color:var(--text);-webkit-text-stroke:0}
.hero-role{margin-top:30px;color:var(--accent);font-size:clamp(14px,1.5vw,19px);font-weight:700;letter-spacing:.08em}
.hero-description{max-width:62ch;margin-top:16px;color:rgba(255,255,255,.82);font-size:15px;line-height:1.65}
h2{font-size:clamp(32px,4.6vw,64px);letter-spacing:-.035em;line-height:1.05;font-weight:700;max-width:16ch}
.sub{max-width:46ch;color:var(--muted);line-height:1.7;margin-top:22px;font-size:15px}
.hr{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
.tag{max-width:280px;text-align:right}.tag h3{font-size:24px;letter-spacing:-.02em;font-weight:600}
.tags{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid var(--line);font-size:13px}
.tags em{color:var(--accent);font-style:normal;font-weight:600;margin-right:8px}
.chip{position:absolute;display:flex;gap:10px;align-items:center;font-size:12px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid var(--line);animation:fl 6s ease-in-out infinite}
.chip small{background:rgba(255,255,255,.14);padding:2px 8px;border-radius:99px;font-size:10px}
@keyframes fl{50%{transform:translateY(-12px)}}
.brands{padding:40px 0;border-block:1px solid var(--line);background:rgba(7,4,10,.4);backdrop-filter:blur(10px);overflow:hidden;max-width:none}
.brands p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 5vw 22px}
.mq{display:flex;gap:70px;width:max-content;min-width:max-content;white-space:nowrap;animation:mq 24s linear infinite;font-size:22px;font-weight:600;letter-spacing:-.02em;opacity:.85;will-change:transform}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(var(--brand-loop-shift))}}
.big{font-size:clamp(70px,15vw,230px);line-height:.88;font-weight:800;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.7);margin-bottom:60px}
.hero-stats{display:flex;flex-direction:column}
.hero-stat{display:grid;grid-template-columns:minmax(80px,.65fr) 1fr;align-items:center;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.hero-stat:first-child{border-top:1px solid var(--line)}
.hero-stat b{font-size:clamp(38px,4vw,56px);font-weight:300;color:var(--accent);letter-spacing:-.04em}
.hero-stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:56px}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(14,8,16,.55);backdrop-filter:blur(14px);transition:.35s}.card:hover{transform:translateY(-6px);border-color:var(--accent)}
.card.reel-card{width:100%;padding:0;appearance:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.card.reel-card:focus-visible,.showcase-modal button:focus-visible,.showcase-modal a:focus-visible{outline:2px solid #ff3b4e;outline-offset:3px}
.showcase-overlay[hidden]{display:none}
.showcase-overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 10%,rgba(232,54,110,.78),transparent 36%),radial-gradient(ellipse at 88% 90%,rgba(212,20,46,.8),transparent 42%),radial-gradient(ellipse at 55% 110%,rgba(70,0,205,.27),transparent 44%),#5a0a1a;backdrop-filter:blur(12px)}
section.showcase-modal{position:relative;display:grid;width:min(1120px,calc(100vw - 48px));height:min(724px,calc(100vh - 48px));height:min(724px,calc(100svh - 48px));min-width:0;min-height:0;grid-template-columns:400px minmax(0,1fr);overflow:hidden;padding:0;max-width:none;margin:0;border:1px solid #ff6b8a33;border-radius:28px;background:#13060b;box-shadow:0 30px 110px rgba(16,0,5,.58);color:#f8eff1}
.showcase-close{position:absolute;top:16px;right:16px;z-index:10;display:grid;width:40px;height:40px;place-items:center;padding:0;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(19,6,11,.86);backdrop-filter:blur(14px);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.12);cursor:pointer;transition:transform .24s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .2s}
.showcase-close-icon{display:block;width:18px;height:18px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.showcase-close::before{position:absolute;inset:-5px;border:1px solid rgba(255,107,138,.48);border-radius:50%;content:"";opacity:0;transform:scale(.82);transition:opacity .2s,transform .24s;pointer-events:none}
.showcase-close:hover{transform:scale(1.05);border-color:#ff6b8a;background:rgba(255,59,78,.92);box-shadow:0 0 0 4px rgba(255,59,78,.12),0 0 28px rgba(255,59,78,.34)}
.showcase-close:hover .showcase-close-icon{transform:rotate(90deg)}
.showcase-close:hover::before{opacity:1;transform:scale(1)}
.showcase-close:active{transform:scale(.93)}
.showcase-stage{position:relative;display:flex;min-width:0;min-height:0;flex-direction:column;border-right:1px solid rgba(255,107,138,.18);background:radial-gradient(ellipse at 20% 12%,rgba(255,59,78,.2),transparent 45%),radial-gradient(ellipse at 85% 85%,rgba(232,54,110,.13),transparent 48%),linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px),#1a0810;background-size:auto,auto,32px 32px,32px 32px,auto}
section.showcase-stage,section.showcase-library{padding:0;max-width:none;margin:0}
.showcase-stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 24px 0}
.showcase-status{display:flex;align-items:center;gap:8px;color:#ffa3ae;font:500 9px/1.4 'JetBrains Mono',monospace;letter-spacing:.16em}
.showcase-status i{width:7px;height:7px;border-radius:50%;background:#ff3b4e;box-shadow:0 0 12px #ff3b4e;font-style:normal}
.showcase-chip,.mono{font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.showcase-chip{padding:7px 9px;border:1px solid rgba(255,107,138,.24);border-radius:7px;background:rgba(28,10,16,.72);color:#ffb1ba;font-size:8px}
.featured-stage{display:grid;flex:1;min-height:0;place-items:center;padding:14px 24px}
.reel-device{position:relative;height:min(360px,42vh);max-width:100%;aspect-ratio:9/16;overflow:hidden;border:1px solid rgba(255,107,138,.48);border-radius:27px;background:linear-gradient(155deg,#ff5b61,#d51b39 54%,#330916);box-shadow:0 18px 56px rgba(255,35,65,.2),inset 0 0 28px rgba(255,255,255,.12)}
.preview-art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,var(--art-a,#ff625b),var(--art-b,#a90c2c));color:#fff}
.preview-art img{width:100%;height:100%;object-fit:cover}
.preview-art-placeholder{position:absolute;top:13px;left:12px;max-width:calc(100% - 24px);padding:5px 7px;border-radius:6px;background:rgba(19,6,11,.75);color:#ffe0e4;font:500 8px/1.3 'JetBrains Mono',monospace;overflow-wrap:anywhere}
.reel-device .preview-art{position:absolute;inset:0}
.reel-device:after{position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,6,11,.05) 40%,rgba(19,6,11,.86) 100%);content:"";pointer-events:none}
.reel-play{position:absolute;top:50%;left:50%;z-index:2;display:grid;width:58px;height:58px;place-items:center;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;transform:translate(-50%,-50%);cursor:pointer;backdrop-filter:blur(8px)}
.reel-type-chip{position:absolute;top:14px;left:14px;z-index:3;padding:7px 9px;border-radius:6px;background:#4b101a;color:#fff;font:700 8px/1 'JetBrains Mono',monospace;letter-spacing:.1em}
.reel-device-copy{position:absolute;right:16px;bottom:24px;left:16px;z-index:2;color:#fff}
.reel-device-copy strong{display:block;font:italic 24px/1.05 'Instrument Serif',serif}
.reel-device-copy small{display:block;margin-top:8px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.reel-progress{position:absolute;right:14px;bottom:12px;left:14px;z-index:3;height:3px;border-radius:99px;background:rgba(255,255,255,.3)}
.reel-progress span{display:block;width:28%;height:100%;border-radius:inherit;background:#fff}
.instagram-embed{display:flex;width:100%;max-width:540px;min-height:320px;max-height:100%;justify-content:center;overflow:auto;border-radius:12px;background:#fff}
.instagram-embed blockquote{width:100%!important;min-width:0!important;max-width:540px!important;margin:0 auto!important}
.instagram-fallback{display:grid;min-height:320px;place-items:center;padding:24px;color:#272727;font-size:13px;text-align:center}
.instagram-fallback a,.instagram-embed blockquote a{color:#272727;font-weight:700}
.carousel-stage{position:relative;width:min(282px,100%);aspect-ratio:4/5}
.carousel-stack{position:absolute;inset:0}
.carousel-stack:before,.carousel-stack:after{position:absolute;inset:0;border:1px solid rgba(255,107,138,.32);border-radius:20px;background:linear-gradient(155deg,#7c1229,#230a14);content:""}
.carousel-stack:before{transform:rotate(-5deg) translate(-9px,5px);opacity:.55}
.carousel-stack:after{transform:rotate(4deg) translate(8px,2px);opacity:.7}
.carousel-slide{position:absolute;inset:0;z-index:1;overflow:hidden;border:1px solid rgba(255,107,138,.7);border-radius:20px;background:linear-gradient(145deg,#ff595c,#bc1230 65%,#370b18);box-shadow:0 16px 42px rgba(0,0,0,.3)}
.carousel-slide img{width:100%;height:100%;object-fit:cover}
.carousel-slide .preview-art-placeholder{top:16px;left:16px}
.carousel-title-overlay{position:absolute;right:18px;bottom:22px;left:18px;color:#fff;font:italic 27px/1.05 'Instrument Serif',serif;text-shadow:0 3px 20px rgba(0,0,0,.55)}
.carousel-count{position:absolute;right:16px;bottom:12px;z-index:3;color:#fff;font:500 8px/1 'JetBrains Mono',monospace;letter-spacing:.12em}
.carousel-arrow{position:absolute;top:50%;z-index:4;display:grid;width:34px;height:34px;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(19,6,11,.72);color:#fff;font-size:17px;transform:translateY(-50%);cursor:pointer}
.carousel-arrow.prev{left:10px}.carousel-arrow.next{right:10px}
.carousel-dots{position:absolute;top:12px;right:0;left:0;z-index:4;display:flex;justify-content:center;gap:6px}
.carousel-dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.carousel-dot[aria-pressed="true"]{width:16px;border-radius:99px;background:#fff}
.stage-details{padding:0 24px 22px}
.stage-divider{margin-bottom:12px;border-top:1px dashed rgba(255,163,174,.34)}
.stage-spec{color:#b4a0a6;font:500 9px/1.5 'JetBrains Mono',monospace;letter-spacing:.08em}
.stage-title{margin-top:8px;color:#fff;font-size:26px;font-weight:800;line-height:1.08;letter-spacing:-.045em;overflow-wrap:anywhere}
.stage-tag{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:6px;background:rgba(255,59,78,.16);color:#ffa3ae;font:500 9px/1.3 'JetBrains Mono',monospace;text-transform:uppercase}
.stage-meta{margin-top:8px;color:#b4a0a6;font:500 9px/1.5 'JetBrains Mono',monospace;overflow-wrap:anywhere}
.stage-missing{margin-top:5px;color:#ffa3ae;font:500 8px/1.4 'JetBrains Mono',monospace;overflow-wrap:anywhere}
.stage-cta{display:flex;width:100%;min-height:46px;align-items:center;justify-content:center;margin-top:14px;padding:10px 14px;border:0;border-radius:12px;background:#ff3b4e;color:#fff;font:700 13px/1.2 'Plus Jakarta Sans',sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.stage-cta:hover{background:#ff5969}.stage-cta:disabled{background:#7d1b2a;color:#ffe0e4;cursor:not-allowed}
.showcase-library{display:flex;min-width:0;min-height:0;flex-direction:column;background:#13060b}
.library-scroll{min-height:0;flex:1;overflow:auto;padding:20px 28px 16px}
.brand-tabs{display:flex;gap:7px;overflow-x:auto;margin-right:52px;padding:2px 72px 6px 0;scrollbar-width:none}
.brand-tabs::-webkit-scrollbar{display:none}
.brand-tab{flex:none;padding:8px 12px;border:1px solid rgba(255,163,174,.18);border-radius:999px;background:#1c0a10;color:#d7c6ca;font:600 10px/1.2 'Plus Jakarta Sans',sans-serif;white-space:nowrap;cursor:pointer}
.brand-tab[aria-pressed="true"]{border-color:#ff3b4e;background:rgba(255,59,78,.14);color:#fff;box-shadow:0 0 16px rgba(255,59,78,.14)}
.library-eyebrow{margin-top:13px;color:#ff9daa;font:500 9px/1.5 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase}
.library-heading{margin-top:7px;color:#fff;font-size:42px;font-weight:800;line-height:.98;letter-spacing:-.065em}
.library-heading em{margin-left:7px;color:#ff3b4e;font:italic 42px/.98 'Instrument Serif',serif;letter-spacing:-.03em}
.library-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:17px 0 15px}
.media-segments{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid rgba(255,163,174,.16);border-radius:999px;background:#1c0a10}
.media-segment{display:flex;align-items:center;gap:6px;padding:8px 10px;border:0;border-radius:999px;background:transparent;color:#c8b7bc;font:600 10px/1 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.media-segment[hidden]{display:none}
.media-segment span{font:500 8px/1 'JetBrains Mono',monospace}
.media-segment[aria-pressed="true"]{background:#f8eff1;color:#18080d}
.media-segment:disabled{opacity:.42;cursor:not-allowed}
.showing-count{flex:none;color:#b4a0a6;font:500 8px/1.3 'JetBrains Mono',monospace;letter-spacing:.1em}
.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.media-card{position:relative;display:flex;min-width:0;flex-direction:column;overflow:hidden;padding:0;border:1px solid rgba(255,107,138,.12);border-radius:18px;background:#1c0a10;color:#fff;text-align:left;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s}
.media-card:hover{transform:translateY(-2px);border-color:rgba(255,107,138,.5)}
.media-card[aria-pressed="true"]{border-color:#ff3b4e;box-shadow:0 0 0 1px #ff3b4e,0 0 22px rgba(255,59,78,.22)}
.media-card-thumb{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(140deg,var(--art-a,#ff565c),var(--art-b,#8b1028))}
.media-card-thumb img{width:100%;height:100%;object-fit:cover}
.media-card-thumb .preview-art-placeholder{top:auto;bottom:8px;left:8px}
.media-type-badge{position:absolute;top:8px;left:8px;z-index:2;padding:5px 6px;border-radius:5px;background:rgba(19,6,11,.86);color:#fff;font:700 7px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.media-index{position:absolute;top:8px;right:8px;color:#fff;font:500 8px/1 'JetBrains Mono',monospace;text-shadow:0 1px 5px #000}
.media-card-body{display:flex;min-width:0;flex:1;flex-direction:column;padding:9px}
.media-tag{color:#ffa3ae;font:500 8px/1.3 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.media-card-title{margin-top:5px;color:#fff;font-size:11px;font-weight:800;line-height:1.28;overflow-wrap:anywhere}
.media-card-meta{margin-top:6px;color:#b4a0a6;font:500 7px/1.35 'JetBrains Mono',monospace;letter-spacing:.03em;overflow-wrap:anywhere}
.empty-state{margin:8px 0;padding:13px 15px;border:1px dashed rgba(255,163,174,.26);border-radius:10px;color:#d6c6ca;font-size:11px;line-height:1.5}
.mobile-featured{display:none}
.stage-empty{max-width:240px;padding:20px;border:1px dashed rgba(255,163,174,.28);border-radius:14px;color:#d6c6ca;font-size:12px;line-height:1.6;text-align:center}
.mobile-featured-card{overflow:hidden;border:1px solid rgba(255,107,138,.24);border-radius:16px;background:#1c0a10}
.mobile-featured-copy{display:grid;gap:4px;padding:10px 12px}.mobile-featured-copy strong{font-size:13px;line-height:1.3}
.showcase-footer{position:relative;display:flex;min-height:72px;align-items:center;justify-content:space-between;gap:12px;overflow:hidden;padding:12px 22px;background:linear-gradient(90deg,#c4122f,#ff3b4e 55%,#ff6a3d);color:#fff}
.footer-copy{position:relative;z-index:1;font-size:9px;line-height:1.5}.footer-copy b{display:block;font:700 9px/1.4 'JetBrains Mono',monospace;letter-spacing:.1em}.footer-copy b:before{content:"> ";color:#ffe0e4}
.footer-brand{position:absolute;right:170px;bottom:-23px;color:transparent;font-size:68px;font-weight:800;line-height:1;letter-spacing:-.08em;-webkit-text-stroke:1px rgba(255,255,255,.28);pointer-events:none}
.footer-instagram{position:relative;z-index:1;flex:none;padding:9px 12px;border:1px solid rgba(255,255,255,.66);border-radius:999px;background:transparent;color:#fff;font:700 8px/1.2 'JetBrains Mono',monospace;text-decoration:none;white-space:nowrap;cursor:pointer}
.footer-instagram:hover{background:rgba(255,255,255,.14)}.footer-instagram:disabled{opacity:.84;cursor:not-allowed}
.mobile-action{display:none}
.showcase-open{overflow:hidden}
@media(max-width:900px){section.showcase-modal{grid-template-columns:350px minmax(0,1fr)}.library-scroll{padding-right:20px;padding-left:20px}.library-heading,.library-heading em{font-size:36px}}

$('#cfStage').addEventListener('pointercancel',()=>{coverflowPointerX=null});
const bg=$('#bg'),ctx=bg.getContext('2d',{alpha:false});
const frameCount=235,frameDir='frames-enhanced',frames=new Map(),loadedFrames=new Set(),maxCachedFrames=10;
let targetProgress=0,currentProgress=0,lastTime=0,raf=0,lastDrawnFrame=-1;
if(!ctx)throw new Error('Canvas is unavailable for the background animation.');
function currentFrameIndex(){
 return Math.min(frameCount-1,Math.max(0,Math.round(currentProgress*(frameCount-1))));
}
function resizeCanvas(){
const rect=bg.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);
const width=Math.round(rect.width*scale),height=Math.round(rect.height*scale);
const resized=bg.width!==width||bg.height!==height;
if(resized){bg.width=width;bg.height=height;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high'}
return resized;
}
function drawFrame(source,index){
const sourceWidth=source&&(source.videoWidth||source.naturalWidth),sourceHeight=source&&(source.videoHeight||source.naturalHeight);
if(!sourceWidth||!sourceHeight)return false;
resizeCanvas();
const scale=Math.max(bg.width/sourceWidth,bg.height/sourceHeight);
const width=sourceWidth*scale,height=sourceHeight*scale;
ctx.clearRect(0,0,bg.width,bg.height);
ctx.drawImage(source,(bg.width-width)/2,(bg.height-height)/2,width,height);
lastDrawnFrame=index;
return true;
}
function requestFrame(index){
 const current=frames.get(index);
 if(current){current.used=performance.now();return current}
 const image=new Image(),entry={image,ready:false,used:performance.now()};
 frames.set(index,entry);
 image.decoding='async';
 image.onload=()=>{entry.ready=true;entry.used=performance.now();loadedFrames.add(index);trimFrames();drawNearestFrame()};
 image.onerror=()=>{if(frames.get(index)===entry)frames.delete(index);console.error(`Unable to load background frame ${index+1}.`)};
 image.src=`${frameDir}/ezgif-frame-${String(index+1).padStart(3,'0')}.jpg`;
 return entry;
}
function trimFrames(){
 const ready=[...frames.entries()].filter(([,entry])=>entry.ready);
 if(ready.length<=maxCachedFrames)return;
 const target=currentFrameIndex();
 ready.sort((first,second)=>Math.abs(second[0]-target)-Math.abs(first[0]-target)||first[1].used-second[1].used);
 let remaining=ready.length;
 for(const [index] of ready){
  if(remaining<=maxCachedFrames)break;
  if(index===lastDrawnFrame)continue;
  frames.delete(index);
  remaining--;
 }
}
function drawNearestFrame(force){
 const target=currentFrameIndex();
 let nearestLoaded=null;
 loadedFrames.forEach(index=>{
  if(nearestLoaded===null||Math.abs(index-target)<Math.abs(nearestLoaded-target))nearestLoaded=index;
 });
 if(nearestLoaded!==null&&!frames.get(nearestLoaded)?.ready)requestFrame(nearestLoaded);
 let nearest=null;
 frames.forEach((entry,index)=>{
  if(entry.ready&&(!nearest||Math.abs(index-target)<Math.abs(nearest.index-target)))nearest={index,entry};
 });
 if(!nearest)return;
 nearest.entry.used=performance.now();
 if(force||nearest.index!==lastDrawnFrame)drawFrame(nearest.entry.image,nearest.index);
}
function render(time){
 raf=0;
 const elapsed=lastTime?Math.min(time-lastTime,50):16;lastTime=time;
 currentProgress+=(targetProgress-currentProgress)*(1-Math.exp(-elapsed/90));
 if(Math.abs(targetProgress-currentProgress)<.0002)currentProgress=targetProgress;
 drawNearestFrame();
 if(Math.abs(targetProgress-currentProgress)>.0002)raf=requestAnimationFrame(render);
}
function updateTarget(){
 const max=document.documentElement.scrollHeight-innerHeight;
 targetProgress=max>0?Math.max(0,Math.min(1,scrollY/max)):0;
 if(!raf)raf=requestAnimationFrame(render);
}
addEventListener('scroll',updateTarget,{passive:true});
addEventListener('resize',()=>{resizeCanvas();drawNearestFrame(true);updateTarget()},{passive:true});
resizeCanvas();
for(let index=0;index<frameCount;index++)requestFrame(index);
updateTarget();
</script>
</body>
</html>
